<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Premium Metallic Gold Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BF953F" />
      <stop offset="25%" stop-color="#FCF6BA" />
      <stop offset="50%" stop-color="#B38728" />
      <stop offset="75%" stop-color="#FBF5B7" />
      <stop offset="100%" stop-color="#AA771C" />
    </linearGradient>

    <linearGradient id="goldShine" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#996515" />
      <stop offset="30%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#FFF9C4" />
      <stop offset="100%" stop-color="#996515" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="goldDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="innerBevel" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur" />
      <feOffset dx="1" dy="2" />
      <feComposite in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="shadowDiff" />
      <feFlood flood-color="#FFF9C4" flood-opacity="0.7" />
      <feComposite in2="shadowDiff" operator="in" />
      <feComposite in2="SourceGraphic" operator="over" />
    </filter>
  </defs>

  <!-- Outer Decorative Ring -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#goldGradient)" stroke-width="4" filter="url(#goldDropShadow)"/>
  
  <!-- Beaded Filigree Outer Ring -->
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldShine)" stroke-width="3" stroke-dasharray="2, 6" stroke-linecap="round"/>
  
  <!-- Middle Ring -->
  <circle cx="250" cy="250" r="214" fill="none" stroke="url(#goldGradient)" stroke-width="6"/>

  <!-- Inner Beaded Ring -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="url(#goldShine)" stroke-width="2"/>
  
  <!-- Inner Rim -->
  <circle cx="250" cy="250" r="192" fill="none" stroke="url(#goldGradient)" stroke-width="3"/>

  <!-- Ornate Decorative Compass Dots -->
  <circle cx="250" cy="18" r="4.5" fill="url(#goldShine)"/>
  <circle cx="250" cy="482" r="4.5" fill="url(#goldShine)"/>
  <circle cx="18" cy="250" r="4.5" fill="url(#goldShine)"/>
  <circle cx="482" cy="250" r="4.5" fill="url(#goldShine)"/>

  <!-- Corner Flourish Accents -->
  <circle cx="85" cy="85" r="3.5" fill="url(#goldShine)"/>
  <circle cx="415" cy="85" r="3.5" fill="url(#goldShine)"/>
  <circle cx="85" cy="415" r="3.5" fill="url(#goldShine)"/>
  <circle cx="415" cy="415" r="3.5" fill="url(#goldShine)"/>

  <!-- Interlocking Classical Monogram 'RS' -->
  <g filter="url(#goldDropShadow)">
    <text x="250" y="292" 
          font-family="'Cinzel', 'Playfair Display', 'Baskerville', 'Georgia', serif" 
          font-size="160" 
          font-weight="700" 
          font-style="italic"
          text-anchor="middle" 
          fill="url(#goldGradient)"
          letter-spacing="-12"
          stroke="url(#goldShine)"
          stroke-width="1.5">
      RS
    </text>
  </g>

  <!-- Fine Monogram Underline Ribbon -->
  <path d="M 160 335 Q 250 350 340 335" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="343" r="3" fill="url(#goldShine)"/>
</svg>
